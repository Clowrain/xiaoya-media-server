<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Xiaoya Media · 影库</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
  <style>
    :root{
      color-scheme:dark;
      --bg:#090a0f;
      --surface:#13161f;
      --surface2:#1a1e2b;
      --surface-glass:rgba(19,22,31,.82);
      --border:rgba(255,255,255,.08);
      --border-focus:rgba(99,102,241,.5);
      --text:#f3f4f8;
      --text-muted:#8e96a5;
      --accent:#3b82f6;
      --accent-hover:#2563eb;
      --accent-soft:rgba(59,130,246,.14);
      --success:#10b981;
      --warning:#f59e0b;
      --danger:#ef4444;
      --radius:16px;
      --radius-sm:10px;
    }
    html[data-theme=light]{
      color-scheme:light;
      --bg:#f4f5f8;
      --surface:#ffffff;
      --surface2:#f0f2f6;
      --surface-glass:rgba(255,255,255,.86);
      --border:rgba(0,0,0,.08);
      --text:#11141a;
      --text-muted:#6b7280;
      --accent:#2563eb;
      --accent-hover:#1d4ed8;
      --accent-soft:rgba(37,99,235,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font:14px -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    a,button,input,select,textarea{font:inherit}
    button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      min-height:38px;
      padding:8px 16px;
      border-radius:var(--radius-sm);
      border:0;
      background:var(--accent);
      color:#fff;
      font-weight:600;
      cursor:pointer;
      transition:background .15s,opacity .15s,transform .15s;
    }
    button:hover{background:var(--accent-hover)}
    button:active{transform:scale(.98)}
    button:disabled{opacity:.4;cursor:not-allowed}
    button.secondary{
      background:var(--surface2);
      color:var(--text);
      border:1px solid var(--border);
    }
    button.secondary:hover{background:rgba(255,255,255,.08)}
    button.danger{background:rgba(239,68,68,.14);color:#f87171;border:1px solid rgba(239,68,68,.25)}
    button.danger:hover{background:rgba(239,68,68,.25)}
    .icon-btn{
      width:38px;
      height:38px;
      padding:0;
      border-radius:50%;
      background:transparent;
      color:var(--text-muted);
      border:1px solid transparent;
    }
    .icon-btn:hover{background:var(--surface2);color:var(--text)}
    .icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

    input,select,textarea{
      height:42px;
      padding:0 14px;
      border-radius:var(--radius-sm);
      background:var(--surface2);
      border:1px solid var(--border);
      color:var(--text);
      outline:none;
      transition:border-color .15s,box-shadow .15s;
    }
    input:focus,select:focus,textarea:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px var(--accent-soft);
    }
    input::placeholder{color:var(--text-muted);opacity:.7}

    /* Header */
    header{
      position:sticky;
      top:0;
      z-index:30;
      height:60px;
      padding:0 clamp(16px,3vw,36px);
      display:flex;
      align-items:center;
      gap:16px;
      background:var(--surface-glass);
      backdrop-filter:blur(24px) saturate(180%);
      -webkit-backdrop-filter:blur(24px) saturate(180%);
      border-bottom:1px solid var(--border);
    }
    .logo-btn{
      font-size:18px;
      font-weight:800;
      letter-spacing:-.04em;
      background:none;
      border:0;
      color:var(--text);
      padding:0;
      cursor:pointer;
    }
    .header-nav{display:flex;align-items:center;gap:8px;margin-left:auto}
    .nav-pill{
      padding:6px 14px;
      border-radius:20px;
      background:transparent;
      color:var(--text-muted);
      font-size:13px;
      font-weight:600;
      border:1px solid transparent;
    }
    .nav-pill.active,.nav-pill:hover{
      background:var(--accent-soft);
      color:var(--accent);
      border-color:rgba(59,130,246,.25);
    }

    /* Common layout */
    main{max-width:1440px;margin:auto;padding:24px clamp(16px,3vw,36px) 64px}
    h1{font-size:clamp(26px,3vw,34px);letter-spacing:-.04em;margin:0 0 10px}
    h2{font-size:20px;letter-spacing:-.03em;margin:0 0 14px}
    h3{font-size:16px;margin:18px 0 10px}
    p,.muted{color:var(--text-muted);line-height:1.6}
    .badge{
      display:inline-flex;
      align-items:center;
      padding:3px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:600;
      background:var(--accent-soft);
      color:var(--accent);
    }
    .badge.ok{background:rgba(16,185,129,.14);color:#34d399}
    .badge.warn{background:rgba(245,158,11,.14);color:#fbbf24}
    .badge.err{background:rgba(239,68,68,.14);color:#f87171}
    .panel{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:24px;
      margin-bottom:20px;
    }
    .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

    /* Cinema view */
    .hero-banner{
      position:relative;
      min-height:min(54vh,480px);
      border-radius:22px;
      overflow:hidden;
      background:#111;
      margin-bottom:30px;
      display:flex;
      align-items:flex-end;
      padding:36px;
    }
    .hero-bg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      filter:brightness(.65);
    }
    .hero-mask{
      position:absolute;
      inset:0;
      background:linear-gradient(0deg,rgba(9,10,15,.95) 0%,rgba(9,10,15,.4) 50%,transparent 100%),linear-gradient(90deg,rgba(9,10,15,.85) 0%,transparent 65%);
    }
    .hero-copy{position:relative;z-index:2;max-width:560px}
    .hero-copy h1{font-size:clamp(30px,4.5vw,52px);line-height:1.05;margin:8px 0 12px;color:#fff}
    .hero-copy p{font-size:14px;color:rgba(255,255,255,.78);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

    .shelf-tabs{
      display:flex;
      gap:10px;
      overflow-x:auto;
      padding:4px 2px 16px;
      scroll-snap-type:x proximity;
    }
    .shelf-card{
      flex:0 0 clamp(160px,18vw,220px);
      cursor:pointer;
      border-radius:14px;
      overflow:hidden;
      background:var(--surface);
      border:1px solid var(--border);
      transition:transform .18s,border-color .18s;
    }
    .shelf-card:hover{transform:translateY(-3px);border-color:var(--accent)}
    .shelf-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
    .shelf-card strong{display:block;padding:10px 12px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .poster-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
      gap:22px 14px;
      margin:20px 0;
    }
    .poster-card{cursor:pointer;min-width:0;position:relative}
    .poster-card img{
      width:100%;
      aspect-ratio:2/3;
      object-fit:cover;
      border-radius:12px;
      background:var(--surface2);
      border:1px solid var(--border);
      box-shadow:0 6px 18px rgba(0,0,0,.25);
      transition:transform .18s,box-shadow .18s;
      display:block;
    }
    .poster-card:hover img{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.45)}
    .poster-card strong{display:block;font-size:13.5px;margin:8px 2px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .poster-card .muted{font-size:12px;margin-left:2px}

    /* Admin layout */
    .admin-shell{
      display:grid;
      grid-template-columns:220px minmax(0,1fr);
      gap:28px;
      align-items:start;
    }
    .admin-sidebar{
      position:sticky;
      top:84px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .admin-nav-item{
      width:100%;
      height:44px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 14px;
      border-radius:var(--radius-sm);
      background:transparent;
      color:var(--text-muted);
      font-weight:600;
      font-size:13.5px;
      justify-content:flex-start;
      border:0;
    }
    .admin-nav-item:hover{background:var(--surface2);color:var(--text)}
    .admin-nav-item.active{background:var(--accent-soft);color:var(--accent)}
    .admin-nav-item svg{width:18px;height:18px;flex-shrink:0}

    /* Data table & list */
    .item-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .item-row{
      display:flex;
      align-items:center;
      gap:14px;
      padding:14px 18px;
      background:var(--surface);
      border-bottom:1px solid var(--border);
    }
    .item-row:last-child{border-bottom:0}
    .item-row:hover{background:var(--surface2)}
    .item-info{flex:1;min-width:0;line-height:1.5}
    .item-info strong{display:block;font-size:14px;overflow-wrap:anywhere}
    .item-info small{color:var(--text-muted);font-size:12px;display:block}

    /* Stat Cards */
    .stat-row{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
      gap:14px;
      margin-bottom:22px;
    }
    .stat-card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:16px 20px;
    }
    .stat-card small{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px}
    .stat-card strong{font-size:24px;display:block}

    /* Progress ring */
    .scan-circle{
      --pct:0%;
      background:conic-gradient(var(--accent) var(--pct),var(--surface2) 0);
      width:44px;
      height:44px;
      border-radius:50%;
      display:grid;
      place-items:center;
      flex-shrink:0;
    }
    .scan-circle span{
      width:34px;
      height:34px;
      background:var(--surface);
      border-radius:50%;
      display:grid;
      place-items:center;
      font-size:10px;
      font-weight:700;
    }

    /* Dialogs */
    dialog{
      max-width:min(900px,calc(100vw - 24px));
      background:var(--surface);
      color:var(--text);
      border:1px solid var(--border);
      border-radius:22px;
      padding:24px;
      box-shadow:0 24px 80px rgba(0,0,0,.6);
    }
    dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .form-grid.single{grid-template-columns:1fr}
    .form-grid label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-muted)}
    .form-grid input,.form-grid select{width:100%}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
    .toggle-row input[type=checkbox]{appearance:none;width:40px;height:22px;border-radius:99px;background:#444;position:relative;cursor:pointer}
    .toggle-row input[type=checkbox]:before{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
    .toggle-row input[type=checkbox]:checked{background:var(--accent)}
    .toggle-row input[type=checkbox]:checked:before{transform:translateX(18px)}

    /* Detail dialog */
    dialog.detail-dialog{width:min(1060px,calc(100vw - 20px));padding:0;overflow:hidden;border-radius:24px}
    .detail-hero{position:relative;min-height:280px;background:#111;overflow:hidden;display:flex;align-items:flex-end;padding:28px}
    .detail-hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.5)}
    .detail-header{position:relative;z-index:2;display:flex;gap:22px;align-items:flex-end}
    .detail-poster{width:140px;aspect-ratio:2/3;object-fit:cover;border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.5);flex-shrink:0}
    .detail-body{padding:24px 28px 34px}
    .actors-scroll{display:flex;gap:12px;overflow-x:auto;padding:6px 0 14px}
    .actor-card{flex:0 0 88px;text-align:center}
    .actor-card img,.actor-card .placeholder{width:88px;height:120px;border-radius:10px;object-fit:cover;background:var(--surface2);display:block}
    .actor-card small{display:block;font-size:11px;color:var(--text-muted);margin-top:4px}
    video{width:100%;max-height:65vh;background:#000;border-radius:14px;margin-top:16px}

    /* Logs & Toast */
    #toast{
      position:fixed;
      bottom:24px;
      left:50%;
      transform:translateX(-50%);
      z-index:99;
      background:var(--surface2);
      color:var(--text);
      border:1px solid var(--border);
      padding:12px 24px;
      border-radius:12px;
      box-shadow:0 10px 40px rgba(0,0,0,.45);
      display:none;
      max-width:90%;
      text-align:center;
    }
    #logs{width:min(880px,94vw);height:min(640px,85vh);padding:20px}
    .log-box{max-height:calc(85vh - 120px);overflow-y:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px}
    .log-line{padding:10px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere}

    @media(max-width:860px){
      .admin-shell{grid-template-columns:1fr}
      .admin-sidebar{position:static;flex-direction:row;overflow-x:auto}
      .admin-nav-item{white-space:nowrap;width:auto}
      .hero-banner{padding:20px;min-height:300px}
      .detail-header{flex-direction:column;align-items:flex-start}
      .detail-poster{width:110px}
      .form-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header>
    <button class="logo-btn" onclick="token?showBrowse():showLogin()">Xiaoya Media</button>
    <div class="header-nav" id="header-nav"></div>
  </header>

  <main id="app"></main>

  <dialog id="modal"></dialog>
  <dialog id="logs" aria-label="全链路运行日志与排错中心" style="width:min(980px,96vw);height:min(720px,90vh);padding:22px">
    <div class="bar" style="margin-bottom:12px;justify-content:space-between">
      <div class="bar">
        <h2 style="margin:0">全链路运行日志</h2>
        <span class="badge ok" id="log-live-badge">实时更新中</span>
      </div>
      <div class="bar">
        <select id="log-cat" onchange="switchLogCategory(this.value)">
          <option value="all" selected>🌟 全部链路日志 (All)</option>
          <option value="playback">🎬 播放与 302 重定向</option>
          <option value="http">🌐 Emby 客户端请求流</option>
          <option value="scan">⚡ 媒体扫描与小雅同步</option>
          <option value="tmdb">🎬 TMDB 刮削记录</option>
          <option value="error">⚠️ 仅看错误与异常</option>
        </select>
        <input id="log-kw" placeholder="搜索片名、路径、IP、状态码、错误…" style="width:200px" oninput="debounceLogs()">
        <button class="secondary" title="复制所有当前日志" onclick="copyLogs()">复制日志</button>
        <button class="secondary icon-btn" title="清空日志" onclick="run(clearCurrentLogs)()">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
        <button class="secondary icon-btn" title="关闭" onclick="$('#logs').close()">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="muted bar" id="log-summary" style="font-size:12px;margin-bottom:10px;justify-content:space-between"></div>
    <div class="log-box" id="log-content" style="max-height:calc(90vh - 140px)"></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let token=sessionStorage.token||'', user=JSON.parse(sessionStorage.user||'null'), device=localStorage.device||(localStorage.device=crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));
    let currentView='browse', adminTab=0, heartbeat, activePlaybackId, wallCursors=[""], wallPage=0, wallKey="", currentFilterParent='', currentSearchTerm='';
    let xyPrefillMatch=null, logCategory='scan', logTimer, logGen=0;

    function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(t.timer);t.timer=setTimeout(()=>t.style.display='none',4000)}
    async function api(path,method='GET',data){
      const res=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Emby-Token':token,'X-Emby-Authorization':`Emby Client="Xiaoya Web", Device="Browser", DeviceId="${device}", Version="2.0"`},body:data===undefined?undefined:JSON.stringify(data)});
      let b=await res.text();try{b=JSON.parse(b)}catch{}
      if(!res.ok)throw Error(b.Message||b.error||`HTTP ${res.status}`);
      return b;
    }
    function run(fn){return async(...args)=>{try{await fn(...args)}catch(e){toast(e.message)}}}

    /* Theme */
    function toggleTheme(){const h=document.documentElement,m=h.dataset.theme==='light'?'dark':'light';h.dataset.theme=m;localStorage.setItem('theme',m);renderNav()}
    document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark';

    /* Nav */
    function renderNav(){
      const n=$('#header-nav');if(!n)return;
      if(!token){n.innerHTML=`<button class="icon-btn" title="切换深浅主题" onclick="toggleTheme()">${themeSvg()}</button>`;return}
      n.innerHTML=`
        <button class="nav-pill ${currentView==='browse'?'active':''}" onclick="showBrowse()">影库</button>
        ${user?.Policy?.IsAdministrator?`<button class="nav-pill ${currentView==='admin'?'active':''}" onclick="showAdmin()">控制台</button>`:''}
        ${user?.Policy?.IsAdministrator?`<button class="icon-btn" title="运行日志" onclick="openLogs()"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 8h8M8 12h8M8 16h5"/></svg></button>`:''}
        <button class="icon-btn" title="修改密码" onclick="showPasswordDialog()"><svg viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>
        <button class="icon-btn" title="退出登录" onclick="logout()"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
        <button class="icon-btn" title="切换深浅主题" onclick="toggleTheme()">${themeSvg()}</button>
      `;
    }
    function themeSvg(){
      return document.documentElement.dataset.theme==='light'
        ?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M2 12h2M20 12h2M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5"/></svg>'
        :'<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>';
    }

    /* Auth */
    function showLogin(){
      currentView='login';renderNav();
      $('#app').innerHTML=`
        <div style="min-height:70vh;display:grid;place-items:center">
          <div class="panel" style="width:min(360px,90vw);padding:32px 28px;text-align:center">
            <h1 style="font-size:24px;margin-bottom:6px">Xiaoya Media</h1>
            <p class="muted" style="margin-bottom:24px;font-size:13px">登录你的家庭影院服务</p>
            <form id="f-login" style="display:grid;gap:12px;text-align:left">
              <input name="u" placeholder="用户名" required autocomplete="username">
              <input name="p" type="password" placeholder="密码" required autocomplete="current-password">
              <button style="height:44px;margin-top:6px">登录</button>
            </form>
          </div>
        </div>`;
      $('#f-login').onsubmit=run(async e=>{
        e.preventDefault();
        const f=new FormData(e.target), res=await api('/emby/Users/AuthenticateByName','POST',{Username:f.get('u'),Pw:f.get('p')});
        token=res.AccessToken;user=res.User;sessionStorage.token=token;sessionStorage.user=JSON.stringify(user);
        showBrowse();
      });
    }
    async function logout(){
      try{await stopVideo();await api('/Sessions/Logout','POST',{})}catch{}
      token='';user=null;sessionStorage.clear();showLogin();
    }
    function showPasswordDialog(){
      const d=$('#modal');d.innerHTML=`
        <h2>修改密码</h2>
        <form id="f-pw" class="form-grid single" style="margin-top:16px">
          <label>当前原密码<input type="password" name="old" required></label>
          <label>新密码（至少 10 位）<input type="password" name="new" minlength="10" required></label>
          <div class="bar" style="justify-content:flex-end;margin-top:12px">
            <button type="button" class="secondary" onclick="$('#modal').close()">取消</button>
            <button type="submit">保存并重登</button>

    function filterByLib(id){currentFilterParent=id;currentSearchTerm='';$('#kw-search').value='';wallPage=0;loadWall()}
    async function loadWall(){
      const key=currentFilterParent+"|"+currentSearchTerm;
      if(wallPage===0||key!==wallKey){wallCursors=[""];wallKey=key}
      const params=new URLSearchParams({Limit:48,Cursor:wallCursors[wallPage]||"",EnableTotalRecordCount:"false",SearchTerm:currentSearchTerm,ParentId:currentFilterParent});
      if(currentSearchTerm)params.set('Recursive','true');
      if(!currentFilterParent)params.set('IncludeItemTypes','Movie,Series');
      const b=await api('/emby/Items?'+params);
      wallCursors[wallPage+1]=b.NextCursor||'';

      $('#wall-title').textContent=currentSearchTerm?`搜索：“${currentSearchTerm}”`:currentFilterParent?'当前媒体分类':'全部影视';
      const grid=$('#poster-grid');
      if(!b.Items.length){
        grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px 0" class="muted">暂无匹配的影视资源</div>';
      }else{
        grid.innerHTML=b.Items.map(it=>`
          <article class="poster-card" data-id="${esc(it.Id)}" data-folder="${it.IsFolder}">
            <img loading="lazy" decoding="async" src="/emby/Items/${esc(it.Id)}/Images/Primary?MaxWidth=420&api_key=${encodeURIComponent(token)}" alt="${esc(it.Name)}">
            <strong>${esc(it.Name)}</strong>
            <span class="muted">${it.IsFolder?'文件夹':(it.ProductionYear||'直接播放')}</span>
          </article>`).join('');
      }

      // Hero background
      const first=b.Items.find(x=>!x.IsFolder)||b.Items[0];
      if(first){
        const bg=$('#hero-bg');
        if(bg){
          bg.src=`/emby/Items/${esc(first.Id)}/Images/Primary?MaxWidth=1400&api_key=${encodeURIComponent(token)}`;
          bg.style.display='block';
        }
        if($('#hero-title'))$('#hero-title').textContent=first.Name;
        if($('#hero-desc'))$('#hero-desc').textContent=first.Overview||'小雅智能 STRM 直链即点即播。';
      }

      // Bind clicks & Context Menu
      grid.querySelectorAll('.poster-card').forEach(el=>{
        el.onclick=run(async()=>{
          if(el.dataset.folder==='true'){currentFilterParent=el.dataset.id;wallPage=0;await loadWall()}
          else await openDetail(el.dataset.id);
        });
        if(user?.Policy?.IsAdministrator){
          el.oncontextmenu=e=>{e.preventDefault();openPosterActionMenu(el.dataset.id,el.querySelector('strong').textContent)};
        }
      });

      // Paging
      $('#paging-bar').innerHTML=`
        <button class="secondary" ${wallPage===0?'disabled':''} id="page-prev">上一页</button>
        <span class="muted" style="font-size:13px">第 ${wallPage+1} 页</span>
        <button class="secondary" ${!b.HasMore?'disabled':''} id="page-next">下一页</button>
      `;
      $('#page-prev').onclick=()=>{wallPage--;loadWall()};
      $('#page-next').onclick=()=>{wallPage++;loadWall()};
    }

    async function openDetail(id){

      const primary=`/emby/Items/${id}/Images/Primary?MaxWidth=480&api_key=${encodeURIComponent(token)}`;
      const backdrop=`/emby/Items/${id}/Images/Backdrop?MaxWidth=1600&api_key=${encodeURIComponent(token)}`;

      const d=$('#modal');d.className='detail-dialog';
      d.innerHTML=`

            <div style="flex:1">
              <span class="badge ok">DIRECT STREAM</span>
              <h2 style="font-size:clamp(24px,3.5vw,36px);margin:8px 0 6px;color:#fff">${esc(x.Name)}</h2>
              <div class="muted" style="color:rgba(255,255,255,.75);font-size:13px;margin-bottom:12px">
                ${x.ProductionYear||''} ${x.RunTimeTicks?`· ${Math.round(x.RunTimeTicks/6e8)} 分钟`:''}
              </div>
              <div class="bar">
                <button id="btn-play">▶ 播放视频</button>
                ${versions.length>1?`<select id="sel-ver" style="height:38px">${versions.map((v,i)=>`<option value="${esc(v.Id)}">版本 ${i+1}: ${esc(v.Name)}</option>`).join('')}</select>`:''}

                <button class="secondary" onclick="closeModal()">关闭</button>
              </div>
            </div>
          </div>
        </section>
        <div class="detail-body">
          <p style="font-size:14px;margin-top:0">${esc(x.Overview||'暂无剧情介绍。')}</p>
          <div id="video-container"></div>
          ${(x.People||[]).length?`
            <h3>演职员</h3>
            <div class="actors-scroll">
              ${(x.People||[]).slice(0,12).map(p=>`
                <div class="actor-card">
                  ${p.PrimaryImageTag?`<img src="/emby/Items/${p.Id}/Images/Primary?tag=${p.PrimaryImageTag}&api_key=${encodeURIComponent(token)}" alt="">`:'<div class="placeholder"></div>'}
                  <strong style="display:block;font-size:12px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.Name)}</strong>
                  <small>${esc(p.Role||'')}</small>
                </div>`).join('')}
            </div>`:''}
        </div>`;
      d.showModal();

      async function startPlay(){
        await stopVideo();
        const pb=await api(`/emby/Items/${selectedVersion}/PlaybackInfo`,'POST',{});
        const src=pb.MediaSources?.find(v=>v.Id===selectedVersion)||pb.MediaSources?.[0];
        if(!src?.DirectStreamUrl)throw Error('无法获取直链播放地址');
        activePlaybackId=selectedVersion;
        const box=$('#video-container');
        box.innerHTML='<video controls autoplay playsinline controlsList="nodownload"></video>';
        const v=box.querySelector('video');
        v.src=src.DirectStreamUrl;
        v.onerror=()=>toast('浏览器无法直接解码此视频流，建议使用外部 Emby 客户端直连播放。');
        clearInterval(heartbeat);
        heartbeat=setInterval(()=>{
          api('/Sessions/Playing/Progress','POST',{ItemId:activePlaybackId,PositionTicks:Math.floor(v.currentTime*1e7),RunTimeTicks:Number.isFinite(v.duration)?Math.floor(v.duration*1e7):0}).catch(()=>{});
        },25000);
        v.onended=()=>stopVideo();
      }
      $('#btn-play').onclick=run(startPlay);
      $('#sel-ver')?.addEventListener('change',e=>{selectedVersion=e.target.value;startPlay()});
      $('#btn-probe')?.addEventListener('click',run(async()=>{
        await api(`/emby/Items/${id}/RefreshMediaInfo`,'POST',{});
        toast('媒体信息提取任务已下发');
      }));
    }

    async function stopVideo(){
      clearInterval(heartbeat);
      const v=$('video');
      if(v){v.pause();v.removeAttribute('src');v.load()}
      if(activePlaybackId){
        const i=activePlaybackId;activePlaybackId=null;
        try{await api('/Sessions/Playing/Stopped','POST',{ItemId:i,PositionTicks:0})}catch{}
      }
    }
    function closeModal(){stopVideo();$('#modal').close();$('#modal').innerHTML='';$('#modal').className=''}

    async function loadAListItems(){

          :await api('/api/alist/browse?'+new URLSearchParams({path:alistPath}));

        if(!items.length){box.innerHTML='<div class="muted" style="padding:28px;text-align:center">当前目录无项目或无搜索结果</div>';return}
        box.innerHTML=items.map(it=>{

                ${it.is_dir
                  ?`<button onclick="run(()=>importAList('${esc(full)}',true,true))()">整剧追更入库</button><button class="secondary" onclick="run(()=>importAList('${esc(full)}',true,false))()">单次入库</button>`
                  :`<button onclick="run(()=>importAList('${esc(full)}',false,false))()">入库</button>`}
              </div>
            </div>`;
        }).join('');

    }

            </label>
            <div class="bar" style="grid-column:1/-1;justify-content:flex-end;margin-top:10px">
              <button type="submit">保存服务设置</button>
            </div>
          </form>
        </div>`;

      $('#f-sys').onsubmit=run(async e=>{
        e.preventDefault();const f=e.target.elements;
        const ports=f.proxyPorts.value.split(',').map(s=>Number(s.trim())).filter(n=>n>0);
        await api('/admin/enhancements','PUT',{
          ServerName:f.serverName.value.trim(),
          ThirdPartyProxyPorts:ports,
          ScanConcurrency:Number(f.scanConcurrency.value),
          UpdateConcurrency:Number(f.updateConcurrency.value),
          WatchEnabled:f.watchEnabled.checked,
          WatchDelaySeconds:30,
          SearchByInitials:f.initials.checked,
          HideMissingActorImages:true,
          MergeVersionsInFolder:true,
          MergeVersionsAcrossLibraries:true,
          FastCDN:true
        });
        await api('/admin/media-info','PUT',{
          Browse:f.medBrowse.checked,
          PreloadNext:f.medPreload.checked,
          Persistent:true,
          Directory:med.Directory,
          Concurrency:med.Concurrency||2
        });
        toast('系统配置已成功保存');renderTabSystemUsers();
      });
    }

    function dialogAddUser(){
      const d=$('#modal');d.className='';
      d.innerHTML=`
        <h2>添加新用户</h2>
        <form id="f-newuser" class="form-grid single" style="margin-top:14px">
          <label>用户名<input name="name" required></label>
          <label>密码（至少 10 位）<input name="pw" type="password" minlength="10" required></label>
          <label>同时播放设备上限<input name="max" type="number" min="1" max="100" value="2"></label>
          <label class="toggle-row">允许串流播放<input type="checkbox" name="allow" checked></label>
          <div class="bar" style="justify-content:flex-end;margin-top:12px">
            <button type="button" class="secondary" onclick="closeModal()">取消</button>
            <button type="submit">创建用户</button>
          </div>
        </form>`;
      d.showModal();
      $('#f-newuser').onsubmit=run(async e=>{
        e.preventDefault();const f=new FormData(e.target);
        await api('/admin/users','POST',{Name:f.get('name'),Password:f.get('pw'),MaxDevices:Number(f.get('max')),AllowPlayback:f.has('allow')});
        closeModal();toast('用户已创建');renderTabSystemUsers();
      });
    }
    async function editUserModal(id){
      const list=await api('/admin/users');const u=list.find(x=>x.Id===id);if(!u)return;
      const d=$('#modal');d.className='';
      d.innerHTML=`
        <h2>编辑用户 · ${esc(u.Name)}</h2>
        <form id="f-edituser" class="form-grid single" style="margin-top:14px">
          <label>重置密码（留空保持不变）<input name="pw" type="password" minlength="10" placeholder="留空不变"></label>
          <label>同时播放设备上限<input name="max" type="number" min="1" max="100" value="${u.MaxDevices}"></label>
          <label class="toggle-row">允许串流播放<input type="checkbox" name="allow" ${u.Policy?.EnableMediaPlayback?'checked':''}></label>
          <div class="bar" style="justify-content:flex-end;margin-top:12px">
            <button type="button" class="secondary" onclick="closeModal()">取消</button>
            <button type="submit">保存更改</button>
          </div>
        </form>`;
      d.showModal();
      $('#f-edituser').onsubmit=run(async e=>{
        e.preventDefault();const f=new FormData(e.target);
        if(f.get('pw'))await api('/admin/user-identity','PUT',{ID:id,Name:u.Name,Password:f.get('pw')});
        await api('/admin/users','PUT',{ID:id,MaxDevices:Number(f.get('max')),Admin:u.Policy?.IsAdministrator,AllowPlayback:f.has('allow')});
        closeModal();toast('用户设置已保存');renderTabSystemUsers();
      });
    }
    async function deleteUser(id){if(confirm('确定删除该用户？')){await api('/admin/users','DELETE',{ID:id});toast('已删除用户');renderTabSystemUsers()}}

    /* Global Polling for Scans */
    let scanTimer;
    async function pollAdminScan(){
      clearTimeout(scanTimer);if(currentView!=='admin'||adminTab!==0)return;
      try{
        const b=await api('/admin/logs');
        const jobs=b.Entries.filter(x=>['scan','update'].includes(x.Category));
        const active=jobs.find(x=>x.State==='running')||jobs[0];
        const ring=$('#admin-scan-ring');
        if(ring){
          const pct=active?(active.State==='complete'?100:active.Total?Math.min(95,Math.floor(active.Done/active.Total*95)):0):0;
          ring.style.setProperty('--pct',pct+'%');
          ring.firstElementChild.textContent=pct+'%';
          ring.title=active?`${active.Name} · ${active.State} (${active.Done}/${active.Total})`:'空闲就绪';
        }
      }catch{}
      scanTimer=setTimeout(pollAdminScan,2000);
    }

    /* Logs Dialog */
    logCategory='all';
    let logSearchKw='', logDebounceTimer, currentLogItems=[];
    function openLogs(){$('#logs').showModal();refreshLogsNow()}
    function switchLogCategory(cat){logCategory=cat;refreshLogsNow()}
    function debounceLogs(){clearTimeout(logDebounceTimer);logDebounceTimer=setTimeout(()=>{logSearchKw=$('#log-kw').value.trim();refreshLogsNow()},250)}
    async function clearCurrentLogs(){await api('/admin/logs','DELETE');currentLogItems=[];refreshLogsNow();toast('运行日志已清空')}
    async function refreshLogsNow(){
      clearTimeout(logTimer);if(!$('#logs').open)return;
      try{
        const qs=new URLSearchParams({category:logCategory,q:logSearchKw,limit:'300'});
        const data=await api('/admin/logs?'+qs);
        const list=data.Items||[];
        currentLogItems=list;
        $('#log-summary').innerHTML=`<span>总记录数: <strong>${data.Total||list.length}</strong> 条 · 在线播放: <strong>${data.OnlinePlayback||0}</strong> 台</span><span>最后刷新: ${new Date().toLocaleTimeString()}</span>`;
        const box=$('#log-content');
        if(!list.length){
          box.innerHTML='<div class="muted" style="padding:40px 20px;text-align:center">暂无匹配的运行日志，可在客户端发起播放或刷新媒体后查看</div>';
        }else{
          box.innerHTML=list.map(it=>{
            const isErr=it.level==='ERROR'||it.status>=400||Boolean(it.error);
            const is302=it.level==='302'||it.status===302||it.status===301;
            const badgeCls=isErr?'err':is302?'ok':'ok';
            const badgeTxt=is302?'302 直链':isErr?`ERR ${it.status||''}`:`${it.method||'INFO'} ${it.status||''}`;
            const timeStr=it.time?new Date(it.time).toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'})+' .'+String(new Date(it.time).getMilliseconds()).padStart(3,'0'):'';
            return `
              <div class="log-line" style="background:${isErr?'rgba(239,68,68,.08)':is302?'rgba(59,130,246,.08)':'transparent'};padding:10px 12px;border-radius:8px;margin-bottom:6px">
                <div class="bar" style="margin-bottom:4px;font-size:12px;justify-content:space-between">
                  <div class="bar">
                    <span class="badge ${badgeCls}">${badgeTxt}</span>
                    <strong style="font-size:13px">${esc(it.title||it.path||'系统事件')}</strong>
                    <span class="muted">${timeStr}</span>
                    ${it.duration_ms?`<span class="muted">· ${it.duration_ms.toFixed(1)}ms</span>`:''}
                  </div>
                  <span class="muted" style="font-size:11px">${esc(it.client||'')} ${it.ip?`(${esc(it.ip)})`:''}</span>
                </div>
                ${it.path?`<div style="font-size:12px;color:var(--text);margin-bottom:4px"><code>${esc(it.method||'GET')} ${esc(it.path)}</code></div>`:''}
                <div style="font-size:12px;overflow-wrap:anywhere;color:${isErr?'#fca5a5':is302?'#93c5fd':'var(--text)'}">${esc(it.message||'')}</div>
                ${it.target?`<div style="font-size:11px;color:#60a5fa;margin-top:3px;overflow-wrap:anywhere">↳ 302 目标 CDN: <code>${esc(it.target)}</code></div>`:''}
                ${it.error?`<div style="font-size:11px;color:#f87171;margin-top:4px;overflow-wrap:anywhere;background:rgba(239,68,68,.12);padding:6px 10px;border-radius:6px">错误信息: ${esc(it.error)}</div>`:''}
                ${it.detail&&it.detail!==it.error?`<div class="muted" style="font-size:11px;margin-top:4px;overflow-wrap:anywhere">详情: ${esc(it.detail)}</div>`:''}
              </div>`;
          }).join('');
        }
      }catch(e){
        $('#log-summary').textContent='日志拉取失败: '+e.message;
      }
      logTimer=setTimeout(refreshLogsNow,2000);
    }
    function copyLogs(){
      if(!currentLogItems.length){toast('当前无日志可复制');return}
      const text=currentLogItems.map(it=>`[${it.time||''}] [${it.level||'INFO'}] ${it.method||''} ${it.path||''} -> ${it.status||''} | ${it.client||''} (${it.ip||''}) | ${it.message||''} ${it.target?`-> Location: `+it.target:''} ${it.error?`[Err: `+it.error+`]`:''}`).join('\n');
      navigator.clipboard?.writeText(text).then(()=>toast('已复制全部日志到剪贴板')).catch(()=>toast('复制失败，请手动选取'));
    }

    // Init App
    if(token&&user){renderNav();showBrowse()}
    else showLogin();
  </script>
</body>
</html>

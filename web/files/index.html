<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文件管理 · Xiaoya Media</title>
  <style>
    :root{color-scheme:dark;--bg:#090a0d;--surface:#14161b;--surface2:#1f2229;--line:rgba(255,255,255,.09);--text:#f7f7f8;--muted:#9a9fa8;--accent:#2f81f7;--accent-hover:#388bfd;--danger:#f85149;--radius:14px}
    html[data-theme=light]{--bg:#f2f4f7;--surface:#fff;--surface2:#f8f9fa;--line:rgba(17,24,39,.09);--text:#111318;--muted:#6e7681;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",sans-serif;min-height:100vh}
    header{position:sticky;top:0;z-index:10;height:58px;padding:0 24px;display:flex;align-items:center;gap:14px;background:rgba(9,10,13,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--line)}
    html[data-theme=light] header{background:rgba(255,255,255,.82)}
    button,input,select{font:inherit}
    button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 16px;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s}
    button:hover{background:var(--accent-hover)}button:disabled{opacity:.4;cursor:not-allowed}
    button.secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line)}
    html[data-theme=light] button.secondary{background:#eef1f4}
    button.danger{background:rgba(248,81,73,.15);color:var(--danger);border:1px solid rgba(248,81,73,.3)}
    .icon-btn{width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line)}
    .icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    input,select{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:10px;outline:none}
    html[data-theme=light] input,html[data-theme=light] select{background:#fff;border-color:#d0d7de}
    input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,129,247,.18)}
    main{max-width:1200px;margin:auto;padding:24px 20px 60px}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
    .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 18px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:13px}
    .crumbs a,.crumbs button{background:none;border:0;padding:4px 6px;color:var(--muted);cursor:pointer;border-radius:6px;text-decoration:none}
    .crumbs a:hover,.crumbs button:hover{color:var(--accent);background:rgba(255,255,255,.05)}
    .crumbs span.sep{color:var(--muted);opacity:.5}
    .toolbar{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .toolbar .search-box{display:flex;align-items:center;gap:8px;flex:1;min-width:260px}
    .toolbar .search-box input{flex:1}
    table{width:100%;border-collapse:collapse;text-align:left}
    th,td{padding:12px 18px;border-bottom:1px solid var(--line)}
    th{font-weight:600;color:var(--muted);font-size:12px;user-select:none;cursor:pointer}
    th:hover{color:var(--text)}
    tr:last-child td{border-bottom:0}
    tr:hover td{background:rgba(255,255,255,.025)}
    .name-cell{display:flex;align-items:center;gap:12px}
    .name-cell svg{width:20px;height:20px;flex-shrink:0;color:var(--muted)}
    .name-cell.dir svg{color:#f59e0b}
    .name-cell.media svg{color:#38bdf8}
    .name-cell a{color:inherit;text-decoration:none;font-weight:500;overflow-wrap:anywhere}
    .name-cell a:hover{color:var(--accent);text-decoration:underline}
    .actions{display:flex;gap:6px;justify-content:flex-end}
    .empty{text-align:center;padding:48px 20px;color:var(--muted)}
    dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:18px;max-width:440px;width:92%;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
    dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);border:1px solid var(--line);padding:10px 20px;border-radius:10px;display:none;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.4)}
    @media(max-width:700px){.hide-sm{display:none}th,td{padding:10px 12px}}
  </style>
</head>
<body>
  <header>
    <a href="/#admin" class="icon-btn" title="返回后台管理" aria-label="返回后台管理">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <strong style="font-size:16px;letter-spacing:-.02em">媒体空间 · 文件管理</strong>
    <button class="icon-btn" style="margin-left:auto" title="切换主题" onclick="toggleTheme()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
  </header>

  <main>
    <div id="auth-err" class="panel" style="display:none;padding:40px;text-align:center;max-width:450px;margin:10vh auto">
      <h2 style="margin:0 0 10px">需要管理员登录</h2>
      <p style="color:var(--muted);margin:0 0 20px">请使用 Emby 管理员账号登录后打开文件管理。</p>
      <a href="/" style="display:inline-block;padding:10px 20px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600">前往登录</a>
    </div>

    <div id="file-app" class="panel" style="display:none">
      <div class="crumbs" id="crumbs"></div>
      <div class="toolbar">
        <button class="secondary" id="btn-up">⬆ 上一级</button>
        <button class="secondary" id="btn-refresh">刷新</button>
        <div class="search-box">
          <input id="search-input" placeholder="搜索文件或文件夹…">
          <select id="search-scope">
            <option value="current">当前目录</option>
            <option value="global">全局范围</option>
          </select>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th onclick="toggleSort('name')">名称 <span id="sort-name"></span></th>
            <th class="hide-sm" style="width:120px" onclick="toggleSort('size')">大小 <span id="sort-size"></span></th>
            <th class="hide-sm" style="width:170px" onclick="toggleSort('modified')">修改时间 <span id="sort-modified"></span></th>
            <th style="width:130px;text-align:right">操作</th>
          </tr>
        </thead>
        <tbody id="file-list"></tbody>
      </table>
    </div>
  </main>

  <dialog id="diag-rename">
    <h3 style="margin:0 0 14px">重命名</h3>
    <input id="rename-input" style="width:100%;margin-bottom:16px" required>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="secondary" onclick="$('#diag-rename').close()">取消</button>
      <button id="rename-confirm">确认</button>
    </div>
  </dialog>

  <div id="toast"></div>

  <script>
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let curPath='/',sortKey='name',sortOrder='asc',targetItem=null;
    function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
    function toggleTheme(){const h=document.documentElement,m=h.dataset.theme==='light'?'dark':'light';h.dataset.theme=m;localStorage.setItem('files-theme',m)}
    document.documentElement.dataset.theme=localStorage.getItem('files-theme')||'dark';

    async function api(path,method='GET',data){
      const res=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Emby-Token':sessionStorage.getItem('token')||''},body:data?JSON.stringify(data):undefined});
      const b=await res.json().catch(()=>({}));
      if(!res.ok)throw Error(b.error||b.Message||`HTTP ${res.status}`);
      return b;
    }

    function renderCrumbs(){
      const parts=curPath.split('/').filter(Boolean);
      let html='<button onclick="navPath(\'/\')">根目录</button>';
      let acc='';
      for(const p of parts){
        acc+='/'+p;
        const target=acc;
        html+=`<span class="sep">/</span><button onclick="navPath('${esc(target)}')">${esc(p)}</button>`;
      }
      $('#crumbs').innerHTML=html;
    }

    function fmtSize(b){
      if(!b||b<=0)return '—';
      const units=['B','KB','MB','GB','TB'];let i=0;
      while(b>=1024&&i<units.length-1){b/=1024;i++}
      return b.toFixed(i?1:0)+' '+units[i];
    }
    function fmtDate(s){return s?new Date(s).toLocaleString('zh-CN',{dateStyle:'short',timeStyle:'short'}):'—'}

    function getIcon(isDir,name){
      if(isDir)return '<svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>';
      const ext=(name.split('.').pop()||'').toLowerCase();
      if(['mp4','mkv','strm','ts','avi','mov'].includes(ext))return '<svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M17 3v18M3 7.5h4M3 12h18M3 16.5h4M17 7.5h4M17 16.5h4"/></svg>';
      return '<svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>';
    }

    async function load(){
      const q=$('#search-input').value.trim();
      const scope=$('#search-scope').value;
      const params=new URLSearchParams({path:curPath,search:q,scope,sort:sortKey,order:sortOrder});
      try{
        renderCrumbs();
        const res=await api('/api/files?'+params);
        const list=res.entries||[];
        const tbody=$('#file-list');
        if(!list.length){
          tbody.innerHTML='<tr><td colspan="4" class="empty">目录为空或未找到匹配项</td></tr>';
          return;
        }
        tbody.innerHTML=list.map(it=>{
          const isDir=it.isDir;
          const cls=isDir?'name-cell dir':'name-cell media';
          const clickAction=isDir?`onclick="navPath('${esc(it.path)}')"`:'';
          return `<tr>
            <td>
              <div class="${cls}">
                ${getIcon(isDir,it.name)}
                ${isDir?`<a href="javascript:void(0)" ${clickAction}><strong>${esc(it.name)}</strong></a>`:`<span>${esc(it.name)}</span>`}
              </div>
            </td>
            <td class="hide-sm" style="color:var(--muted)">${fmtSize(it.size)}</td>
            <td class="hide-sm" style="color:var(--muted)">${fmtDate(it.modified)}</td>
            <td>
              <div class="actions">
                <button class="secondary icon-btn" title="重命名" onclick="promptRename('${esc(it.path)}','${esc(it.name)}')">
                  <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                </button>
                <button class="danger icon-btn" title="删除" onclick="deleteItem('${esc(it.path)}','${esc(it.name)}')">
                  <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </div>
            </td>
          </tr>`;
        }).join('');
      }catch(e){toast('加载失败: '+e.message)}
    }

    function navPath(p){curPath=p||'/';load()}
    function toggleSort(k){
      if(sortKey===k)sortOrder=sortOrder==='asc'?'desc':'asc';
      else{sortKey=k;sortOrder='asc'}
      ['name','size','modified'].forEach(key=>{
        $(`#sort-${key}`).textContent=sortKey===key?(sortOrder==='asc'?'↑':'↓'):'';
      });
      load();
    }

    function promptRename(path,name){
      targetItem=path;
      $('#rename-input').value=name;
      $('#diag-rename').showModal();
    }
    $('#rename-confirm').onclick=async()=>{
      const newName=$('#rename-input').value.trim();
      if(!newName||/[\/\\:*?"<>|\x00-\x1f]/.test(newName)){
        toast('名称无效或包含非法字符');return;
      }
      const dir=targetItem.substring(0,targetItem.lastIndexOf('/')+1);
      try{
        await api('/api/files/rename','POST',{oldPath:targetItem,newPath:dir+newName});
        $('#diag-rename').close();
        toast('重命名成功');
        load();
      }catch(e){toast('重命名失败: '+e.message)}
    };

    async function deleteItem(path,name){
      if(!confirm(`确认删除 ${name}？`))return;
      try{
        await api('/api/files','DELETE',{paths:[path]});
        toast('已删除');
        load();
      }catch(e){toast('删除失败: '+e.message)}
    }

    $('#btn-up').onclick=()=>{
      if(curPath==='/')return;
      curPath=curPath.substring(0,curPath.lastIndexOf('/'))||'/';
      load();
    };
    $('#btn-refresh').onclick=()=>load();
    $('#search-input').oninput=()=>{clearTimeout(window.sTimer);window.sTimer=setTimeout(load,300)};
    $('#search-scope').onchange=()=>load();

    (async function init(){
      try{
        const me=await api('/Users/Me');
        if(!me?.Policy?.IsAdministrator)throw Error('非管理员');
        $('#file-app').style.display='block';
        load();
      }catch{
        $('#auth-err').style.display='block';
      }
    })();
  </script>
</body>
</html>

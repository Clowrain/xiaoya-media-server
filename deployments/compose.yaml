name: xiaoya-media-server

services:
  postgres:
    image: postgres:16-alpine
    container_name: xiaoya-media-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER:-emby}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-emby}
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-emby} -d $${POSTGRES_DB:-emby}"]
      interval: 10s
      timeout: 5s
      retries: 6

  xiaoya-media-server:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: xiaoya-media-server:v1.0.0
    container_name: xiaoya-media-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8096}:8096"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LISTEN: 0.0.0.0:8096
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-emby}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-emby}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请先在 .env 中设置至少 12 位的 ADMIN_PASSWORD}
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-}
      DATA_DIR: /data
      MEDIA_ROOTS: /media
      STRM_OUTPUT_ROOT: /media/strm
      XIAOYA_SQLITE_PATH: /xiaoya-db/${XIAOYA_SQLITE_FILENAME:-strm_internal.db}
      MONITOR_ENABLED: ${MONITOR_ENABLED:-true}
      MONITOR_INTERVAL: ${MONITOR_INTERVAL:-10m}
      MONITOR_ROOTS: ${MONITOR_ROOTS:-/每日更新/电视剧/国产剧（115）,/每日更新/电视剧/国产剧}
      ALIST_BASE_URL: ${ALIST_BASE_URL:-http://xiaoya.host:5678}
      STRM_TARGET_BASE_URL: ${STRM_TARGET_BASE_URL:-}
      XIAOYA_USERNAME: ${XIAOYA_USERNAME:-}
      XIAOYA_PASSWORD: ${XIAOYA_PASSWORD:-}
      ALIST_TOKEN: ${ALIST_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-zh-CN}
    volumes:
      # 必须将小雅 SQLite 所在父目录以只读 (:ro) 方式挂载，确保同时可见 .db / .db-wal / .db-shm
      - ${XIAOYA_DB_DIR:?请设置小雅 SQLite 所在宿主机目录 XIAOYA_DB_DIR}:/xiaoya-db:ro
      # 本地 STRM 输出及附件落地目录（读写）
      - ${MEDIA_DIR:-./data/media}:/media
      # 应用持久化数据目录（封面缓存、媒体探测缓存、PostgreSQL 自动备份）
      - ${APP_DATA_DIR:-./data/appdata}:/data
      # 统一 YAML 配置文件（环境变量可覆盖敏感字段）
      - ${CONFIG_FILE_HOST:-../configs/config.example.yaml}:/etc/xiaoya-media-server/config.yaml:ro
